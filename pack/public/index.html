<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="conduta.css"></head><body data-cur=""><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><main class="center"><svg class="logo" viewBox="0 0 1254 1254" aria-label="Bloxter"><path pathLength="1" d="M357 882C300 800 300 650 340 560C400 400 520 270 720 262C830 262 860 340 835 430C805 520 740 600 660 665C580 725 490 760 460 690C440 630 520 560 620 515C720 475 810 500 860 560C930 640 950 750 900 850C850 940 760 990 680 985C600 980 530 930 470 880"/></svg><div class="cube glass"><div><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" placeholder="voce@email.com"></div><div><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div><div class="err" id="err"></div><button class="btn" id="go">Entrar</button></div></main><script src="conduta.js"></script><script>api("/me").then(()=>location.replace("workspace")).catch(()=>{});$("#go").onclick=async()=>{const b=$("#go");b.disabled=true;$("#err").textContent="";try{await api("/login",{method:"POST",body:{email:$("#em").value,password:$("#pw").value}});location.href="workspace"}catch(e){$("#err").textContent=e.message;b.disabled=false}};["em","pw"].forEach(i=>$("#"+i).addEventListener("keydown",e=>e.key==="Enter"&&$("#go").click()));</script></body></html>
