<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workspace</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="conduta.css"></head><body data-cur="ws"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="wrap"><header class="top glass" id="hdr"></header><div class="kpis" id="kp"></div><div class="row sec"><input id="fq" placeholder="Filtrar posts por texto ou usuário"><label class="chk"><input type="checkbox" id="mo"> Só com mídia</label></div><div class="list" id="feed"><div class="empty">Carregando…</div></div></div><script src="conduta.js"></script><script>(async()=>{if(!await start("ws",false))return;postClicks($('#feed'));const seen=new Map();
async function tick(first){try{const posts=(await api('/feed')).posts||[],box=$('#feed'),ids=new Set(posts.map(p=>p.id)),newest=Math.max(0,...seen.keys());
 if(first){box.innerHTML=posts.length?'':'<div class="empty">Nenhum post ainda.</div>';posts.forEach(p=>{seen.set(p.id,p);box.insertAdjacentHTML('beforeend',postHTML(p))});return}
 posts.filter(p=>p.id>newest).reverse().forEach(p=>{seen.set(p.id,p);$('.empty',box)?.remove();box.insertAdjacentHTML('afterbegin',postHTML(p))});
 const min=Math.min(...ids);[...seen.keys()].forEach(id=>{if(id>=min&&!ids.has(id)){seen.delete(id);box.querySelector(`[data-id="${id}"]`)?.remove()}})}
 catch(e){if(first)$('#feed').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
const F=()=>{const q=$('#fq').value.toLowerCase();document.querySelectorAll('#feed .post').forEach(e=>e.hidden=(!!q&&!e.textContent.toLowerCase().includes(q))||($('#mo').checked&&!e.querySelector('.media')))};$('#fq').oninput=F;$('#mo').onchange=F;
const t0=tick;tick=async f=>{await t0(f);F()};tick(true);setInterval(()=>tick(false),3000);
async function kp(){const s=await refreshStats();if(!s)return;$('#kp').innerHTML=[['Denúncias abertas',s.reports||0],['Pedidos de ban pendentes',s.pending],['Membros da equipe',s.team],['Mensagens (24 h)',s.chat_day],['Ações da equipe (24 h)',s.actions_day]].map(([l,v])=>`<div class="kpi card glass"><b>${v}</b><span>${l}</span></div>`).join('')}kp();setInterval(kp,15000);})()</script></body></html>
