<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administração</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="conduta.css"></head><body data-cur="ad"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="wrap"><header class="top glass" id="hdr"></header><div class="sec"><div class="card glass"><h2>Criar conta</h2><p style="color:var(--mut);margin-bottom:12px">Crie o acesso de um novo membro. Ele entra com este e-mail e senha e pode trocá-la depois em Configurações.</p><div class="row"><div><label>Nome</label><input id="tn" placeholder="Nome do membro" maxlength="40"></div><div><label>E-mail</label><input id="te" type="email" placeholder="email@exemplo.com"></div></div><div class="row" style="margin-top:10px;align-items:flex-end"><div><label>Senha inicial (8+)</label><input id="tp" placeholder="Digite ou gere"></div><button class="btn ghost" id="tg2" type="button">Gerar</button><div><label>Função</label><select id="tr"><option value="mod">Moderador</option><option value="admin">Administrador</option></select></div></div><div class="err" id="tg"></div><button class="btn" id="ta">Criar conta</button><div class="reason" id="made" hidden></div></div></div><div class="sec"><div class="card glass"><h2>Equipe</h2><div class="list" id="tm" style="margin-top:10px"></div></div></div><div class="sec"><h2>Solicitações de banimento</h2><div class="sub" id="flt"><button data-s="pending" class="on">Pendentes</button><button data-s="approved">Banidos</button><button data-s="rejected">Recusados</button><button data-s="all">Todos</button></div><div class="list" id="reqs"></div></div>
<div class="sec"><div class="card glass"><h2>Chave de administração do Bloxter</h2><p style="color:var(--mut);margin-bottom:10px" id="ks">Carregando…</p><div class="row"><input id="kk" type="password" placeholder="bx_admin_…"><button class="btn" id="ksv">Salvar chave</button></div><div class="err" id="ke"></div></div></div>
</div><script src="conduta.js"></script><script>(async()=>{if(!await start("ad",true))return;const lab={pending:'Aguardando',approved:'Banido',rejected:'Recusado',unbanned:'Desbanido'};let f='pending',bans=[];
const R=async()=>{bans=(await api('/bans').catch(()=>({bans:[]}))).bans;const r=bans.filter(x=>f==='all'||x.status===f);$('#reqs').innerHTML=r.map(x=>`<div class="card glass"><div class="hd"><b data-p="${esc(x.username)}">@${esc(x.username)}</b><span class="pill">${lab[x.status]}</span><span>pedido por ${esc(x.by_name||'ex-membro')} · ${ago(x.created_at)}</span></div><div class="reason">${esc(x.reason)}</div><div class="acts">${x.status==='pending'?`<button class="btn danger sm" data-a="approve" data-id="${x.id}">Aprovar banimento</button><button class="btn ghost sm" data-a="reject" data-id="${x.id}">Recusar</button>`:''}${x.status==='approved'?`<button class="btn ghost sm" data-a="unban" data-id="${x.id}">Desbanir</button>`:''}</div></div>`).join('')||'<div class="empty">Nenhuma solicitação aqui.</div>'};
$('#flt').onclick=e=>{const s=e.target.closest('button')?.dataset.s;if(!s)return;f=s;$('#flt').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));R()};
$('#reqs').addEventListener('click',async e=>{const t=e.target.closest('[data-a],[data-p]');if(!t)return;if(t.dataset.p)return profile(t.dataset.p);t.disabled=true;try{await api(`/bans/${t.dataset.id}/${t.dataset.a}`,{method:'POST'});toast('Feito');R()}catch(e){toast(e.message);t.disabled=false}});
const K=async()=>{const k=await api('/settings/key');$('#ks').textContent=k.set?`Chave salva (${k.hint})${k.from_env?' · vinda da variável de ambiente':''}. Ela fica no servidor e nunca volta para o navegador.`:'Nenhuma chave salva ainda. Gere em Bloxter › administração › API de administração.'};
$('#ksv').onclick=async()=>{$('#ke').textContent='';try{await api('/settings/key',{method:'PUT',body:{key:$('#kk').value}});$('#kk').value='';toast('Chave salva');K()}catch(e){$('#ke').textContent=e.message}};
const T=async()=>{const u=(await api('/team')).users;$('#tm').innerHTML=u.map(x=>`<div class="row" style="align-items:center">${avatar(x,'sm')}<span style="flex:1">${esc(x.name)} <small style="color:var(--mut)">${esc(x.email)} · ${x.role==='admin'?'admin':'moderador'}</small></span>${x.id===ME.id?'':`<button class="btn ghost sm" data-rs="${x.id}">Nova senha</button><button class="btn danger sm" data-rm="${x.id}">Remover</button>`}</div>`).join('')};
$('#tm').addEventListener('click',async e=>{const t=e.target.closest('[data-rs],[data-rm]');if(!t)return;try{if(t.dataset.rm){if(!confirm('Remover este membro?'))return;await api('/team/'+t.dataset.rm,{method:'DELETE'})}else{const p=prompt('Nova senha (8+ caracteres):');if(!p)return;await api(`/team/${t.dataset.rs}/reset`,{method:'POST',body:{password:p}});toast('Senha redefinida')}T()}catch(e){toast(e.message)}});
$('#tg2').onclick=()=>{const s='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';$('#tp').value=Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>s[x%s.length]).join('')};
$('#ta').onclick=async()=>{$('#tg').textContent='';const b=$('#ta');b.disabled=true;const x={name:$('#tn').value,email:$('#te').value,password:$('#tp').value,role:$('#tr').value};
 try{await api('/team',{method:'POST',body:x});const t=`E-mail: ${x.email.trim().toLowerCase()}\nSenha: ${x.password}`;$('#made').hidden=false;$('#made').innerHTML=`<b>Conta criada!</b><br>${esc(t).replace(/\n/g,'<br>')}<div class="acts" style="margin-top:8px"><button class="btn ghost sm" id="cp">Copiar acesso</button></div>`;$('#cp').onclick=()=>navigator.clipboard.writeText(t).then(()=>toast('Copiado'));['tn','te','tp'].forEach(i=>$('#'+i).value='');T()}catch(e){$('#tg').textContent=e.message}b.disabled=false};
R();K();T();})()</script></body></html>
