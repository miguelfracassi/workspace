<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Histórico</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="conduta.css"></head><body data-cur="hi"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="wrap"><header class="top glass" id="hdr"></header><div class="sub" id="tabs"><button data-t="tw" class="on">Tweets</button><button data-t="eq" id="teq" hidden>Equipe</button></div><section id="s-tw"><div class="row sec"><input id="q" placeholder="Usuário do Bloxter (vazio = todos)"><button class="btn" id="bs">Buscar</button></div><div class="list" id="hl"></div><div style="text-align:center;margin-top:14px"><button class="btn ghost" id="more" hidden>Carregar mais</button></div></section><section id="s-eq" hidden><div class="sec"><select id="who"></select></div><div class="list" id="al"></div></section></div><script src="conduta.js"></script><script>(async()=>{if(!await start("hi",false))return;postClicks($('#hl'));let nb=null,qq='';
async function load(reset){if(reset){$('#hl').innerHTML='<div class="empty">Carregando…</div>';nb=null;qq=$('#q').value}
 try{const d=await api('/history?username='+encodeURIComponent(qq)+(nb?'&before='+nb:''));if(reset)$('#hl').innerHTML='';
  $('#hl').insertAdjacentHTML('beforeend',(d.posts||[]).map(postHTML).join('')||(reset?'<div class="empty">Nenhum post encontrado.</div>':''));nb=d.next_before||(d.posts?.length?d.posts[d.posts.length-1].id:null);$('#more').hidden=!(d.posts||[]).length}
 catch(e){$('#hl').innerHTML=`<div class="empty">${esc(e.message)}</div>`;$('#more').hidden=true}}
$('#bs').onclick=()=>load(true);$('#q').addEventListener('keydown',e=>e.key==='Enter'&&load(true));$('#more').onclick=()=>load(false);load(true);
let eqPeople={};async function act(){const d=await api('/activity?uid='+$('#who').value).catch(e=>({items:[],err:e.message}));$('#al').innerHTML=(d.items||[]).map(i=>`<div class="card glass"><b>${esc(eqPeople[i.uid]||'Ex-membro')}</b> ${esc(i.action)} ${esc(i.detail)} <span class="pill">${ago(i.created_at)}</span></div>`).join('')||'<div class="empty">Sem atividade.</div>'}
if(ME.role==='admin'){$('#teq').hidden=false;const t=(await api('/team')).users;t.forEach(u=>eqPeople[u.id]=u.name);$('#who').innerHTML='<option value="0">Toda a equipe</option>'+t.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('');$('#who').onchange=act}
$('#tabs').onclick=e=>{const t=e.target.closest('button')?.dataset.t;if(!t)return;$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#s-tw').hidden=t!=='tw';$('#s-eq').hidden=t!=='eq';if(t==='eq')act()};})()</script></body></html>
