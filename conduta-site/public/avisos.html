<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Avisos</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="conduta.css"></head><body data-cur="av"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="wrap"><header class="top glass" id="hdr"></header><div class="list" id="reqs"></div></div><script src="conduta.js"></script><script>(async()=>{if(!await start("av",false))return;const lab={pending:'Aguardando',approved:'Banido',rejected:'Recusado',unbanned:'Desbanido'};const d=await api('/bans').catch(e=>({bans:[],err:e.message}));
$('#reqs').innerHTML=d.bans.map(x=>`<div class="card glass"><div class="hd"><b>@${esc(x.username)}</b><span class="pill">${lab[x.status]}</span><span>pedido por ${esc(x.by_name||'ex-membro')} · ${ago(x.created_at)}</span></div><div class="reason">${esc(x.reason)}</div></div>`).join('')||`<div class="empty">${esc(d.err||'Nenhum aviso por enquanto.')}</div>`;})()</script></body></html>
