<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="conduta.css"></head><body data-cur="ch"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="wrap"><header class="top glass" id="hdr"></header><div class="chatbox card glass"><div class="msgs" id="msgs"></div><div class="compose"><input id="tx" placeholder="Mensagem para a equipe" maxlength="1000"><button class="btn" id="sd">Enviar</button></div></div></div><script src="conduta.js"></script><script>(async()=>{if(!await start("ch",false))return;let last=0,pe={};
async function people(){try{pe=Object.fromEntries((await api('/team')).users.map(u=>[u.id,u]))}catch{}}
const mh=m=>{const u=pe[m.uid]||{name:'Ex-membro'},me=m.uid===ME.id;return `<div class="cm${me?' me':''}">${me?'':avatar(u,'sm')}<div class="bub"><b>${esc(u.name)}</b><span>${ago(m.created_at)}</span><div>${esc(m.body)}</div></div></div>`};
async function tick(){try{const d=await api('/chat'+(last?'?after='+last:'')),box=$('#msgs'),st=!last||box.scrollTop+box.clientHeight>=box.scrollHeight-60;
 if(!d.messages.length)return;d.messages.forEach(m=>{last=Math.max(last,m.id);box.insertAdjacentHTML('beforeend',mh(m))});if(st)box.scrollTop=box.scrollHeight;localStorage.cd_seen=last;refreshStats()}catch(e){}}
async function send(){const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';try{await api('/chat',{method:'POST',body:{body:t}});tick()}catch(e){toast(e.message);$('#tx').value=t}}
$('#sd').onclick=send;$('#tx').addEventListener('keydown',e=>e.key==='Enter'&&send());
await people();await tick();setInterval(tick,2000);setInterval(people,30000);$('#tx').focus();})()</script></body></html>
